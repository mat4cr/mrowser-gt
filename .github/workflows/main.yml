name: Build Android APK

on:
  workflow_dispatch: # Umožní spustit kompilaci manuálně

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Javy
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Většina moderních appek vyžaduje Javu 11 nebo 17

      - name: Udělení oprávnění pro Gradle
        run: chmod +x ./gradlew

      - name: Sestavení APK pomocí Gradle
        run: ./gradlew assembleDebug

      - name: Nahrání hotového APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
